<title>MyTech Demo Readiness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F4F5F2; --card:#FFFFFF; --sunk:#ECEEE8; --ink:#17201C; --ink2:#4A554F; --ink3:#7E8983;
  --rule:#DFE3DC; --rule2:#C6CCC4; --accent:#2F4FB5; --accent-bg:#E4E9F8;
  --done:#1E7A4E; --done-bg:#DDF0E4; --doing:#2F4FB5; --doing-bg:#E4E9F8;
  --wait:#9A6212; --wait-bg:#F7EBD4; --block:#B03A2E; --block-bg:#F6DEDA; --todo:#6E7872; --todo-bg:#E8EBE6;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --paper:#111513; --card:#1A1F1C; --sunk:#222825; --ink:#EDF0EC; --ink2:#AEB7B1; --ink3:#7E8983;
  --rule:#2A302C; --rule2:#3C443F; --accent:#8FA5F0; --accent-bg:#1E2748;
  --done:#6FCB97; --done-bg:#143325; --doing:#8FA5F0; --doing-bg:#1E2748;
  --wait:#E0AE5B; --wait-bg:#35270F; --block:#EE8A7E; --block-bg:#3A1C18; --todo:#9AA59F; --todo-bg:#262C28;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#111513; --card:#1A1F1C; --sunk:#222825; --ink:#EDF0EC; --ink2:#AEB7B1; --ink3:#7E8983;
  --rule:#2A302C; --rule2:#3C443F; --accent:#8FA5F0; --accent-bg:#1E2748;
  --done:#6FCB97; --done-bg:#143325; --doing:#8FA5F0; --doing-bg:#1E2748;
  --wait:#E0AE5B; --wait-bg:#35270F; --block:#EE8A7E; --block-bg:#3A1C18; --todo:#9AA59F; --todo-bg:#262C28;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15.5px/1.55 "Instrument Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding-inline:20px;padding-block:44px 80px}
h1,h2,.num{font-family:"Familjen Grotesk",system-ui,sans-serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.eyebrow{font:500 11px/1 "IBM Plex Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0 0 14px}
h1{font-size:clamp(32px,6vw,52px);line-height:1.02;letter-spacing:-.02em;margin:0 0 12px;font-weight:700}
.lede{color:var(--ink2);margin:0;max-width:62ch}
.summary{margin-top:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.summary div{background:var(--card);padding:14px 16px}
.summary b{display:block;font:700 28px/1 "Familjen Grotesk",sans-serif;font-variant-numeric:tabular-nums}
.summary span{display:block;margin-top:6px;font:500 10.5px/1.3 "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.bar{height:6px;background:var(--sunk);margin-top:14px;display:flex;overflow:hidden}
.bar i{display:block;height:100%}
.updated{margin-top:10px;font:12px "IBM Plex Mono",monospace;color:var(--ink3)}
section{margin-top:38px}
.phead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:8px}
.phead .num{font-size:15px;font-weight:700;background:var(--ink);color:var(--paper);padding:2px 8px}
.phead h2{font-size:22px;margin:0;letter-spacing:-.01em}
.phead .count{margin-left:auto;font:12px "IBM Plex Mono",monospace;color:var(--ink3)}
.task{display:grid;grid-template-columns:118px 1fr;gap:6px 16px;padding:14px 0;border-bottom:1px solid var(--rule)}
.chip{justify-self:start;font:600 10.5px/1 "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;padding:6px 8px;border-radius:2px;white-space:nowrap}
.s-done{background:var(--done-bg);color:var(--done)}
.s-doing{background:var(--doing-bg);color:var(--doing)}
.s-waiting{background:var(--wait-bg);color:var(--wait)}
.s-blocked{background:var(--block-bg);color:var(--block)}
.s-todo{background:var(--todo-bg);color:var(--todo)}
.title{font-weight:600}
.detail{color:var(--ink2);margin-top:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-size:13.5px}
.meta .rec{font:12.5px "IBM Plex Mono",monospace;background:var(--sunk);padding:1px 6px;color:var(--ink)}
.meta .note{color:var(--ink2)}
.meta .note b{color:var(--ink)}
.empty{padding:28px;border:1px dashed var(--rule2);color:var(--ink2);margin-top:28px}
@media (max-width:560px){.task{grid-template-columns:1fr}}
</style>

<div class="wrap">
  <p class="eyebrow">ERP Master · Sales app · demo preparation</p>
  <h1>MyTech Demo Readiness</h1>
  <p class="lede">Everything left before the demo: the data, the fixes, a test of every step in the walkthrough, the sales dashboard, and the hand-over. Statuses update as the work lands.</p>
  <div class="summary" id="summary"></div>
  <div class="bar" id="bar" aria-hidden="true"></div>
  <div class="updated" id="updated"></div>
  <div id="phases"></div>
</div>

<script>
const PHASES = [
  ["A","Finish the demo data"],
  ["B","Fixes before testing"],
  ["B2","Sales dashboard"],
  ["C","Test every walkthrough step"],
  ["D","Hand-over for the demo"],
];
const LABEL = {done:"Done", doing:"In progress", waiting:"Needs you", blocked:"Blocked", todo:"To do"};
const ORDER = ["done","doing","waiting","blocked","todo"];
const COLOR = {done:"var(--done)", doing:"var(--doing)", waiting:"var(--wait)", blocked:"var(--block)", todo:"var(--rule2)"};

function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }

function render(tasks){
  const counts = Object.fromEntries(ORDER.map(s=>[s,0]));
  tasks.forEach(t=>{ counts[t.status in counts ? t.status : "todo"]++; });
  const sum = document.getElementById("summary"); sum.replaceChildren();
  ORDER.forEach(s=>{ const d=el("div"); d.append(el("b",null,String(counts[s])), el("span",null,LABEL[s])); sum.append(d); });
  const bar = document.getElementById("bar"); bar.replaceChildren();
  ORDER.forEach(s=>{ if(!counts[s]) return; const i=el("i"); i.style.width=(100*counts[s]/tasks.length)+"%"; i.style.background=COLOR[s]; bar.append(i); });
  const latest = tasks.map(t=>t.updated||"").sort().pop();
  document.getElementById("updated").textContent = latest ? "Last update " + latest : "";

  const host = document.getElementById("phases"); host.replaceChildren();
  PHASES.forEach(([id,name])=>{
    const mine = tasks.filter(t=>t.phase===id).sort((a,b)=>(a.order||0)-(b.order||0));
    if(!mine.length) return;
    const sec = el("section"); const h = el("div","phead");
    const done = mine.filter(t=>t.status==="done").length;
    h.append(el("span","num",id), el("h2",null,name), el("span","count",`${done} of ${mine.length} done`));
    sec.append(h);
    mine.forEach(t=>{
      const row = el("div","task");
      const st = t.status in LABEL ? t.status : "todo";
      row.append(el("span","chip s-"+st, LABEL[st]));
      const body = el("div");
      body.append(el("div","title",t.title||""));
      if(t.detail) body.append(el("div","detail",t.detail));
      if(t.record || t.note){
        const m = el("div","meta");
        if(t.record) m.append(el("span","rec",t.record));
        if(t.note){ const n=el("span","note"); n.textContent=t.note; m.append(n); }
        body.append(m);
      }
      row.append(body); sec.append(row);
    });
    host.append(sec);
  });
}

(async ()=>{
  const db = await claude.use("db");
  if(!db){
    const p = el("div","empty","The task list can't be loaded in this view. Open the page from claude.ai to see it.");
    document.getElementById("phases").replaceChildren(p);
    return;
  }
  db.collection("tasks").onSnapshot(
    snap => render(snap.docs.map(d=>d.data())),
    () => document.getElementById("phases").replaceChildren(el("div","empty","The task list stopped updating. Reload the page."))
  );
})();
</script>
