<style>

figure{margin:0}

.catgrp{margin-block:34px 0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}

.pills{display:flex;flex-wrap:wrap;gap:5px}

.pill.r{background:var(--req-soft);color:var(--req)}

.none{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);font-style:normal}
.note{background:var(--acc-soft);border:1px solid var(--line-2);border-left:3px solid var(--acc);padding:16px 18px;border-radius:2px;margin-block:22px}
.note p{font-size:14.5px;line-height:1.55;color:var(--ink-2);margin:0}

<style>
